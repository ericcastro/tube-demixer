<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube DeMixer — Mixer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/mixer.css">
</head>
<body class="mixer-page">

  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="btn btn-ghost btn-sm">← Projects</a>
      <div id="mixer-title" class="mixer-header-title">Loading…</div>
      <span id="mixer-model" class="model-badge"></span>
    </div>
  </header>

  <!-- Loading state -->
  <div id="loading-state" class="mixer-loading">
    <div class="spinner"></div>
    <p id="loading-msg">Loading project…</p>
  </div>

  <!-- Mixer (hidden until ready) -->
  <div id="mixer-root" class="mixer-root hidden">

    <!-- Transport bar -->
    <div class="transport">
      <button id="play-btn" class="play-btn" aria-label="Play / Pause">
        <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M5 3.5l13 6.5-13 6.5z"/></svg>
      </button>
      <span id="time-current" class="transport-time">0:00</span>
      <div class="seek-wrap">
        <input type="range" id="seek-bar" class="seek-bar" min="0" max="100" step="0.01" value="0">
      </div>
      <span id="time-total" class="transport-time">0:00</span>
      <div class="speed-group">
        <div class="speed-mode-toggle">
          <button id="mode-rate"  class="mode-btn active" title="Speed changes pitch too">Rate</button>
          <button id="mode-tempo" class="mode-btn"        title="Speed without pitch change">Tempo</button>
        </div>
        <input id="speed-slider" class="speed-slider" type="range"
               min="0.25" max="2" step="0.05" value="1">
        <span id="speed-val" class="speed-val">1.00×</span>
      </div>
    </div>

    <!-- Stem tracks -->
    <div id="stems-container" class="stems-container"></div>

  </div>

  <script type="module" src="/js/mixer.js"></script>
</body>
</html>
