<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube DeMixer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">Tube DeMixer</span>
      </div>
      <button id="new-project-btn" class="btn btn-primary">+ New Project</button>
    </div>
  </header>

  <main class="app-main">

    <!-- New project form -->
    <div id="new-project-panel" class="panel hidden" role="dialog" aria-modal="true" aria-label="New project">
      <div class="panel-backdrop"></div>
      <div class="panel-card">
        <h2>New Project</h2>
        <form id="new-project-form" novalidate>
          <div class="field">
            <label for="yt-url">YouTube URL</label>
            <input
              type="url"
              id="yt-url"
              name="youtube_url"
              placeholder="https://www.youtube.com/watch?v=…"
              autocomplete="off"
              required
            >
            <span class="field-error" id="url-error"></span>
          </div>
          <div class="field">
            <label for="proj-name">
              Project name
              <span class="optional">— optional, defaults to video title</span>
            </label>
            <input type="text" id="proj-name" name="name" placeholder="My project">
          </div>
          <div class="field">
            <label for="model-select">Separation model</label>
            <select id="model-select" name="model_id">
              <!-- populated by JS from /api/projects/models -->
            </select>
            <span class="field-hint" id="model-hint"></span>
          </div>
          <div class="field">
            <label for="beat-model-select">Beat detection model</label>
            <select id="beat-model-select" name="beat_model_id">
              <!-- populated by JS from /api/projects/beat-models -->
            </select>
            <span class="field-hint" id="beat-model-hint"></span>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn" class="btn btn-ghost">Cancel</button>
            <button type="submit" class="btn btn-primary" id="create-btn">
              <span class="btn-label">Create &amp; Process</span>
              <span class="btn-spinner hidden"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Project list -->
    <section class="projects-section">
      <div id="empty-state" class="empty-state hidden">
        <p>No projects yet.</p>
        <p class="muted">Paste a YouTube link to get started.</p>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </section>

  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
